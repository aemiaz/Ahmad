<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmad Hassan — Let's Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Great+Vibes&family=Allura&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e3b866; --gold-2:#a9792f; --gold-3:#f6dfa4;
  --bg:#050505; --text:#f1ece1; --muted:#b9b2a3;
  --glass:rgba(255,255,255,.045); --edge:rgba(227,184,102,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:#000; color:var(--text); font-family:'Montserrat',system-ui,sans-serif;
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.poster{
  position:relative; width:100%; max-width:640px; min-height:100vh; overflow:hidden;
  padding:clamp(18px,4vw,34px) clamp(14px,3.5vw,28px) 0;
  background:
    radial-gradient(120% 50% at 50% 12%,rgba(227,184,102,.13),transparent 60%),
    radial-gradient(90% 40% at 90% 55%,rgba(255,255,255,.04),transparent 60%),
    linear-gradient(180deg,#0b0b0c 0%,#050505 45%,#0a0907 100%);
  isolation:isolate;
}
@media(min-width:700px){ .poster{margin:24px 0;border-radius:28px;min-height:0;box-shadow:0 0 0 1px rgba(227,184,102,.2),0 30px 90px rgba(0,0,0,.8)} body{background:radial-gradient(circle at 50% 0,#1a1408,#000 70%)} }
.mount{position:absolute;left:0;right:0;pointer-events:none;z-index:-1}
.mount.top{top:19%;opacity:.5}
.mount.bot{bottom:0;opacity:.85}
.swirl{position:absolute;pointer-events:none;z-index:-1}

/* header */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:8px;min-height:clamp(210px,42vw,270px)}
.side{padding-top:clamp(36px,9vw,70px)}
.lets{font-family:'Great Vibes',cursive;font-size:clamp(34px,8vw,52px);line-height:.95;color:var(--gold-3);
  text-shadow:0 0 18px rgba(227,184,102,.35);transform:rotate(-6deg);transform-origin:left;margin-bottom:14px}
.lets span{display:block;padding-left:14px}
.spaced{font-size:clamp(8px,1.9vw,11px);letter-spacing:.38em;line-height:1.9;color:var(--muted);font-weight:500;text-transform:uppercase}
.rule{display:block;width:28px;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-2));margin-top:10px;border-radius:2px}
.side.right{text-align:right;padding-top:clamp(20px,6vw,50px)}
.side.right .rule{margin-left:auto}

.avatar-wrap{position:relative;width:clamp(150px,36vw,220px);aspect-ratio:1}
.ring{position:absolute;inset:0;border-radius:50%;padding:3px;
  background:conic-gradient(from 200deg,var(--gold-3),var(--gold-2),var(--gold),#fff3c8,var(--gold-2),var(--gold-3));
  box-shadow:0 0 30px rgba(227,184,102,.55),0 0 90px rgba(227,184,102,.25), inset 0 0 20px rgba(227,184,102,.4)}
.avatar{width:100%;height:100%;border-radius:50%;overflow:hidden;border:4px solid #0b0a08;background:#1a1712}
.avatar img,.avatar svg{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.crown{position:absolute;top:-10px;right:-14px;width:clamp(30px,7vw,46px);filter:drop-shadow(0 0 8px rgba(227,184,102,.6))}

/* name */
.name{text-align:center;margin-top:-6px;font-family:'Mrs Saint Delafield','Allura',cursive;font-weight:400;
  font-size:clamp(58px,15vw,100px);line-height:1;white-space:nowrap;
  background:linear-gradient(95deg,#a9792f 0%,#f6dfa4 22%,#c58f3e 40%,#fff 52%,#f4f4f4 75%,#d8d8d8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(227,184,102,.3))}
.tags{display:flex;justify-content:center;align-items:center;gap:clamp(6px,2vw,14px);flex-wrap:wrap;margin-top:6px;
  font-size:clamp(8px,2vw,12px);letter-spacing:.3em;color:#d9d2c3;font-weight:500;text-transform:uppercase}
.tags i{width:1px;height:12px;background:rgba(255,255,255,.4)}

/* glass */
.glass{
  position:relative;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 60%);
  border:1px solid var(--edge);border-radius:22px;
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 8px 30px rgba(0,0,0,.55),0 0 18px rgba(227,184,102,.18),inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 20px rgba(227,184,102,.05);
}
.bio{display:flex;align-items:center;gap:clamp(12px,3vw,24px);margin-top:clamp(16px,4vw,24px);padding:clamp(14px,3vw,22px) clamp(14px,3.5vw,28px)}
.bio .ico{flex:none;width:clamp(38px,9vw,56px);aspect-ratio:1;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;background:rgba(0,0,0,.4)}
.bio .ico svg{width:55%;fill:var(--gold-3)}
.bio p{flex:1;font-size:clamp(11px,2.6vw,15px);line-height:1.65;letter-spacing:.03em;color:#e8e2d4}
.bio .script{flex:none;font-family:'Allura',cursive;font-size:clamp(16px,3.6vw,23px);line-height:1;color:var(--gold-3);transform:rotate(-8deg);text-align:left}
@media(max-width:430px){.bio .script{display:none}}

/* links */
.links{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2.4vw,16px);margin-top:clamp(14px,3vw,20px)}
.link{display:flex;align-items:center;gap:clamp(8px,2vw,14px);padding:clamp(9px,2vw,14px) clamp(10px,2.4vw,16px);
  color:inherit;text-decoration:none;border-radius:20px;transition:transform .25s,box-shadow .25s,border-color .25s;min-width:0;
  -webkit-tap-highlight-color:transparent}
.link:hover,.link:focus-visible{transform:translateY(-3px);outline:none;border-color:var(--gold-3);
  box-shadow:0 12px 34px rgba(0,0,0,.6),0 0 28px rgba(227,184,102,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.link .logo{flex:none;width:clamp(34px,9vw,54px);aspect-ratio:1;border-radius:clamp(9px,2.4vw,14px);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.link .logo svg{width:100%;height:100%;display:block}
.link .txt{flex:1;min-width:0}
.link b{display:block;font-weight:600;font-size:clamp(13px,3.2vw,20px);line-height:1.2}
.link small{display:block;margin-top:2px;font-size:clamp(9px,2.1vw,13px);color:var(--muted);letter-spacing:.03em;line-height:1.3}
.link .chev{flex:none;width:clamp(10px,2.4vw,16px);stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.link.solo{grid-column:1/-1;justify-self:center;width:calc(50% - clamp(5px,1.2vw,8px))}
@media(max-width:380px){.links{grid-template-columns:1fr}.link.solo{width:100%}}

.link.web{grid-column:1/-1;justify-content:flex-start;border-color:var(--gold-3);
  background:linear-gradient(135deg,rgba(227,184,102,.22),rgba(255,255,255,.03) 65%);
  box-shadow:0 8px 30px rgba(0,0,0,.55),0 0 26px rgba(227,184,102,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.link.web .logo{background:linear-gradient(145deg,#f0d28f,#a9792f)}
.side{min-width:0}
/* mobile: keep every word inside the screen */
@media(max-width:560px){
  .hero{gap:4px;min-height:0}
  .avatar-wrap{width:36vw;min-width:128px}
  .side{padding-top:34px}.side.right{padding-top:18px}
  .lets{font-size:clamp(26px,8.4vw,40px);margin-bottom:10px}
  .spaced{letter-spacing:.16em;font-size:clamp(6.5px,2vw,9px);line-height:1.9}
  .tags{flex-wrap:nowrap;gap:6px;letter-spacing:.14em;font-size:clamp(6.5px,2.15vw,10px);white-space:nowrap}
  .tags i{height:10px}
  .cta{letter-spacing:.2em;padding-right:16px}
  .tap,.bottom,.thanks{letter-spacing:.2em}
  .name{font-size:clamp(50px,15.5vw,90px)}
}
/* desktop: scale the whole card so it always fits the screen exactly */
body.fit{height:100vh;height:100dvh;overflow:hidden;align-items:center}
body.fit .poster{flex:none;width:640px;max-width:none;margin:0;min-height:0;transform-origin:center center}
/* cta */
.cta{display:flex;align-items:center;justify-content:center;gap:14px;margin:clamp(22px,5vw,34px) auto 0;max-width:460px;padding:10px 22px 10px 12px;
  border-radius:999px;background:linear-gradient(180deg,#f0d28f,#c79540 55%,#8f6422);
  box-shadow:0 0 30px rgba(227,184,102,.35),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(0,0,0,.35);
  color:#17110a;font-weight:700;font-size:clamp(10px,2.6vw,14px);letter-spacing:.3em;text-transform:uppercase;white-space:nowrap}
.cta .wave{flex:none;width:34px;aspect-ratio:1;border-radius:50%;background:#16110a;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
.cta .wave svg{width:60%;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round}
.tap{text-align:center;margin-top:14px;font-size:clamp(8px,2vw,11px);letter-spacing:.38em;color:var(--muted);text-transform:uppercase}

.foot{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:end;margin-top:clamp(-6px,-1vw,0px);padding-bottom:6px}
.more{font-family:'Allura',cursive;font-size:clamp(20px,5vw,30px);line-height:1;color:var(--gold-3);transform:rotate(-8deg);transform-origin:left;margin-top:18px}
.thanks{text-align:right;font-size:clamp(7.5px,1.9vw,11px);letter-spacing:.3em;color:var(--muted);text-transform:uppercase;line-height:1.9;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.thanks svg{width:clamp(20px,5vw,30px);stroke:var(--gold);fill:none;stroke-width:1.6;flex:none}
.bottom{display:flex;justify-content:center;align-items:center;gap:clamp(8px,3vw,18px);padding:clamp(16px,4vw,26px) 0 clamp(20px,5vw,30px);
  font-size:clamp(8px,2vw,11px);letter-spacing:.3em;color:#cfc8b8;text-transform:uppercase;flex-wrap:wrap}
.bottom i{width:1px;height:14px;background:rgba(255,255,255,.35)}
@media(prefers-reduced-motion:reduce){.link{transition:none}.link:hover{transform:none}}

/* click animation: spin 1s, zoom, open */
.fx{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0);transition:background .35s;overflow:hidden;pointer-events:all}
.fx.on{background:rgba(0,0,0,.72)}
.fx-logo{position:fixed;z-index:1000;border-radius:14px;overflow:hidden;will-change:transform;
  box-shadow:0 0 40px rgba(227,184,102,.7),0 0 90px rgba(227,184,102,.35)}
.fx-logo svg{width:100%;height:100%;display:block}
.fx-logo.spin{animation:fxspin 1s cubic-bezier(.45,.05,.25,1) forwards}
.fx-logo.zoom{transition:transform .6s cubic-bezier(.7,0,.25,1),border-radius .6s}
@keyframes fxspin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(190deg) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
</style>
</head>

  </section>

  <nav class="links" id="links" aria-label="Social links"></nav>

  <div class="cta"><span class="wave"><svg viewBox="0 0 24 24"><path d="M8 8c2.500 2.500 2.500 5.500 0 8M12 5c4 3.500 4 10.500 0 14M16 3c5 4.500 5 13.500 0 18"/></svg></span>Connect • Follow • Support</div>
  <p class="tap">Tap into a brighter network</p>

  <div class="foot">
    <div class="more">More<br>&nbsp;Than a Profile</div>
    <div class="thanks"><span>Thank you<br>for being here</span><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.200-8-11a4.500 4.500 0 0 1 8-2.800A4.500 4.500 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg></div>
  </div>
  <div class="bottom"><span>People</span><i></i><span>Ideas</span><i></i><span>Growth</span><i></i><span>Together</span></div>
</main>
